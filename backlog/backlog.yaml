  # ───────────────────────────── M5 ─────────────────────────────
  - key: E13
    title: "Epic: Quality — testing, accessibility, performance, privacy"
    milestone: M5
    area: quality
    priority: P0
    summary: "Make v1.0 solid, accessible and fast."
    items:
