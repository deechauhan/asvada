      - title: "On this day"
        type: story
        points: 3
        priority: P2
        sprint: 17
        story: "As a user I want to be reminded what I did on this day in past years."
        ac:
          - "Card on the timeline when matches exist"
          - "Optional local notification, off by default"
      - title: "Year in review"
        type: story
        points: 5
        priority: P2
        sprint: 18
        story: "As a user I want a beautiful recap of my year: new countries, top films, best meals."
        ac:
