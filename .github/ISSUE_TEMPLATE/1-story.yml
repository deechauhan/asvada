name: User story
description: User-visible value with acceptance criteria
title: ""
labels: ["type:story"]
body:
  - type: textarea
    id: story
    attributes:
      label: User story
      placeholder: As a … I want … so that …
    validations: {required: true}
  - type: textarea
    id: ac
    attributes:
      label: Acceptance criteria
      description: Testable checklist items
      value: |
        - [ ] 
    validations: {required: true}
  - type: textarea
    id: notes
    attributes:
      label: Design / technical notes
  - type: dropdown
    id: points
    attributes:
      label: Estimate (points)
      options: ["1", "2", "3", "5", "8"]
