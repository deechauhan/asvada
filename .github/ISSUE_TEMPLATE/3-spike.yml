name: Spike
description: Time-boxed research that ends in a decision (ADR)
labels: ["type:spike"]
body:
  - type: textarea
    id: question
    attributes:
      label: Question to answer
    validations: {required: true}
  - type: input
    id: timebox
    attributes:
      label: Time-box
      placeholder: e.g. 1 evening
    validations: {required: true}
  - type: textarea
    id: output
    attributes:
      label: Expected output
      value: |
        - [ ] ADR written in docs/DECISIONS
