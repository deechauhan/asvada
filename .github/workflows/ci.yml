name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A newer push to a PR replaces its older run. Every push to main gets a group of its own, so
  # a docs-only merge can't cancel (or, while queued, replace) the run still testing the code
  # merged before it (#198).
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  # Docs, backlog and other non-code changes skip the Swift jobs (skipped counts as passing).
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.code == 'true' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            code:
              - 'App/**'
              - 'AppUITests/**'
              - 'Packages/**'
              - 'Config/**'
              - 'project.yml'
              - 'scripts/ci/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/ui-tests.yml'
              - '.swiftlint.yml'
              - '.swiftformat'

  lint:
    name: Lint (SwiftLint + SwiftFormat)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: SwiftFormat
        run: docker run --rm -v "$PWD:/work" -w /work ghcr.io/nicklockwood/swiftformat:0.64.7 --lint .
      - name: SwiftLint
        if: success() || failure()
        run: docker run --rm -v "$PWD:/work" -w /work ghcr.io/realm/swiftlint:0.65.1 swiftlint lint --strict --reporter github-actions-logging

  packages:
    name: Package tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history, for restoring file times
      # Unchanged sources keep their commit times, so the cached .build isn't rebuilt from scratch.
      - name: Restore file times
        run: python3 scripts/ci/restore-mtimes.py
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Cache SwiftPM
        uses: actions/cache@v5
        with:
          path: |
            Packages/**/.build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('Packages/**/Package.swift', 'Packages/**/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - name: swift test (each package)
        run: |
          set -e
          for p in Packages/Core/* Packages/Features; do
            echo "::group::$p"
            swift test --package-path "$p"
            echo "::endgroup::"
          done

  # PRs and pushes to main run a smoke set of UI tests: about a minute of tests covering launch,
  # the journal, quick-log, sealing and a country stamp, to keep the checks short. Most of the
  # job is simulator setup, so each test added costs more than it seems (#211). Building the UI
  # test target still catches compile errors in every test. The whole suite runs nightly
  # (nightly.yml); see docs/AUTOPILOT.md for fixing what it finds (#208).
  app:
    name: App
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/ui-tests.yml
    secrets: inherit
    with:
      shards: >-
        [{"name": "smoke", "tests": "-only-testing:AsvadaUITests/LaunchTests/testLaunchShowsJournal
        -only-testing:AsvadaUITests/QuickLogUITests/testAFilmIsLoggedAndACountryStamped"}]
