name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Docs, backlog and other non-code changes skip the Swift jobs (skipped counts as passing).
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.code == 'true' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            code:
              - 'App/**'
              - 'AppUITests/**'
              - 'Packages/**'
              - 'Config/**'
              - 'project.yml'
              - 'scripts/ci/**'
              - '.github/workflows/ci.yml'
              - '.swiftlint.yml'
              - '.swiftformat'

  lint:
    name: Lint (SwiftLint + SwiftFormat)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: SwiftFormat
        run: docker run --rm -v "$PWD:/work" -w /work ghcr.io/nicklockwood/swiftformat:0.64.7 --lint .
      - name: SwiftLint
        if: success() || failure()
        run: docker run --rm -v "$PWD:/work" -w /work ghcr.io/realm/swiftlint:0.65.1 swiftlint lint --strict --reporter github-actions-logging

  packages:
    name: Package tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history, for restoring file times
      # Unchanged sources keep their commit times, so the cached .build isn't rebuilt from scratch.
      - name: Restore file times
        run: python3 scripts/ci/restore-mtimes.py
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Cache SwiftPM
        uses: actions/cache@v5
        with:
          path: |
            Packages/**/.build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('Packages/**/Package.swift', 'Packages/**/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - name: swift test (each package)
        run: |
          set -e
          for p in Packages/Core/* Packages/Features; do
            echo "::group::$p"
            swift test --package-path "$p"
            echo "::endgroup::"
          done

  # The UI tests are split across three runners that work side by side: the two slow
  # context-menu tests, the rest of LaunchTests, and every other test class (new ones included).
  # Each builds for itself (about a minute) and tests its share.
  app:
    name: App build + UI test (${{ matrix.shard.name }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: menus
            tests: >-
              -only-testing:AsvadaUITests/LaunchTests/testEditAndDeleteCustomCollectionButNotBuiltIn
              -only-testing:AsvadaUITests/LaunchTests/testShareTopFiveFromTheCafesDrawer
          - name: launch
            tests: >-
              -only-testing:AsvadaUITests/LaunchTests
              -skip-testing:AsvadaUITests/LaunchTests/testEditAndDeleteCustomCollectionButNotBuiltIn
              -skip-testing:AsvadaUITests/LaunchTests/testShareTopFiveFromTheCafesDrawer
          - name: features
            tests: -skip-testing:AsvadaUITests/LaunchTests
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history, for restoring file times
      # Unchanged sources keep their commit times, so the cached DerivedData only rebuilds what
      # changed (a fresh checkout would make every file look new).
      - name: Restore file times
        run: python3 scripts/ci/restore-mtimes.py
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Cache SwiftPM
        uses: actions/cache@v5
        with:
          path: build/SourcePackages
          key: spm-app-${{ runner.os }}-${{ hashFiles('project.yml', 'Packages/**/Package.swift', 'Packages/**/Package.resolved') }}
          restore-keys: spm-app-${{ runner.os }}-
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Write secrets
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          # Optional: builds still work without it (film search reports "no key").
          if [ -n "$TMDB_API_KEY" ]; then
            printf 'TMDB_API_KEY = %s\n' "$TMDB_API_KEY" > Config/Secrets.xcconfig
          else
            echo "::notice::TMDB_API_KEY secret not set; building without a TMDB key"
          fi
      - name: Generate project
        run: xcodegen generate
      # Build products from the last run on this branch (or main): with file times restored,
      # only what changed recompiles. Keyed per commit; the newest match is restored.
      - name: Cache DerivedData
        uses: actions/cache@v5
        with:
          path: build/DerivedData
          key: derived-${{ runner.os }}-${{ hashFiles('project.yml', 'Packages/**/Package.swift') }}-${{ github.sha }}-${{ matrix.shard.name }}
          restore-keys: |
            derived-${{ runner.os }}-${{ hashFiles('project.yml', 'Packages/**/Package.swift') }}-
            derived-${{ runner.os }}-
      - name: Pick a simulator and start booting it
        id: simulator
        run: |
          UDID=$(scripts/ci/pick-simulator.sh)
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          # Boots while the app builds; `bootstatus` below waits for it.
          xcrun simctl boot "$UDID" || true
      - name: Build for testing
        run: |
          set -o pipefail
          # Restored files have new inodes; let the build system trust their times instead.
          defaults write com.apple.dt.XCBuild IgnoreFileSystemDeviceInodeChanges -bool YES
          xcodebuild build-for-testing \
            -project Asvada.xcodeproj -scheme Asvada \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath build/SourcePackages \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO
      - name: UI tests
        run: |
          set -o pipefail
          xcrun simctl bootstatus "${{ steps.simulator.outputs.udid }}" -b
          xcodebuild test-without-building \
            -project Asvada.xcodeproj -scheme Asvada \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/Asvada.xcresult \
            ${{ matrix.shard.tests }}
      - name: Export screenshots
        if: always()
        run: |
          [ -d build/Asvada.xcresult ] || exit 0
          scripts/ci/export-screenshots.sh build/Asvada.xcresult build/screenshots
          # Also print each PNG as base64 so tools that can read logs but not artifacts can recover them
          # (scripts/screenshots-from-log.py).
          for f in build/screenshots/*.png; do
            [ -e "$f" ] || continue
            echo "SCREENSHOT-BEGIN $(basename "$f")"
            base64 -i "$f" | fold -w 76
            echo "SCREENSHOT-END"
          done
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: screenshots-${{ matrix.shard.name }}
          path: build/screenshots
          if-no-files-found: ignore
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: xcresult-${{ matrix.shard.name }}
          path: build/Asvada.xcresult
          if-no-files-found: ignore
      # Last, so the report sits at the very end of the log, after the screenshot dump: the
      # slowest tests (to see where CI time goes), then any failures with file:line.
      - name: Test report
        if: always()
        run: |
          [ -d build/Asvada.xcresult ] || exit 0
          xcrun xcresulttool get test-results summary --path build/Asvada.xcresult --compact > build/summary.json || exit 0
          xcrun xcresulttool get test-results tests --path build/Asvada.xcresult --compact > build/tests.json || exit 0
          python3 - build/summary.json build/tests.json <<'PY'
          import json, sys

          summary = json.load(open(sys.argv[1]))
          tree = json.load(open(sys.argv[2]))
          cases, failures = [], []

          def walk(node, test=None):
              if node.get("nodeType") == "Test Case":
                  test = node.get("name")
                  cases.append((node.get("durationInSeconds") or 0, node.get("nodeIdentifier") or test))
              if node.get("nodeType") == "Failure Message":
                  failures.append(f"  at {test}: {node.get('name')}")
              for child in node.get("children", []):
                  walk(child, test)

          for root in tree.get("testNodes", []):
              walk(root)
          print(f"{summary.get('result')}: {summary.get('passedTests')} passed, {summary.get('failedTests')} failed of {summary.get('totalTestCount')}")
          print("Slowest tests:")
          for seconds, name in sorted(cases, reverse=True)[:12]:
              print(f"  {seconds:7.1f}s  {name}")
          for failure in summary.get("testFailures", []):
              print(f"FAILED {failure.get('testIdentifierString') or failure.get('testName')}: {failure.get('failureText')}")
          print("\n".join(failures))
          PY
