name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (SwiftLint + SwiftFormat)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: SwiftFormat
        run: docker run --rm -v "$PWD:/work" -w /work ghcr.io/nicklockwood/swiftformat:0.64.7 --lint .
      - name: SwiftLint
        run: docker run --rm -v "$PWD:/work" -w /work ghcr.io/realm/swiftlint:0.65.1 swiftlint lint --strict --reporter github-actions-logging

  packages:
    name: Package tests
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Cache SwiftPM
        uses: actions/cache@v5
        with:
          path: |
            Packages/**/.build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('Packages/**/Package.swift', 'Packages/**/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - name: swift test (each package)
        run: |
          set -e
          for p in Packages/Core/* Packages/Features; do
            echo "::group::$p"
            swift test --package-path "$p"
            echo "::endgroup::"
          done

  app:
    name: App build + UI test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Cache SwiftPM
        uses: actions/cache@v5
        with:
          path: build/SourcePackages
          key: spm-app-${{ runner.os }}-${{ hashFiles('project.yml', 'Packages/**/Package.swift', 'Packages/**/Package.resolved') }}
          restore-keys: spm-app-${{ runner.os }}-
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build and test
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          set -o pipefail
          UDID=$(scripts/ci/pick-simulator.sh)
          xcodebuild test \
            -project Asvada.xcodeproj -scheme Asvada \
            -destination "id=$UDID" \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -resultBundlePath build/Asvada.xcresult \
            CODE_SIGNING_ALLOWED=NO
      - name: Export screenshots
        if: always()
        run: |
          [ -d build/Asvada.xcresult ] || exit 0
          scripts/ci/export-screenshots.sh build/Asvada.xcresult build/screenshots
          # Also print each PNG as base64 so tools that can read logs but not artifacts can recover them
          # (scripts/screenshots-from-log.py).
          for f in build/screenshots/*.png; do
            [ -e "$f" ] || continue
            echo "SCREENSHOT-BEGIN $(basename "$f")"
            base64 -i "$f" | fold -w 76
            echo "SCREENSHOT-END"
          done
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: screenshots
          path: build/screenshots
          if-no-files-found: ignore
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: xcresult
          path: build/Asvada.xcresult
          if-no-files-found: ignore
