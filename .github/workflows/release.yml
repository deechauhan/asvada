name: Release

# Publishes a GitHub Release with generated notes (PRs since the previous release, grouped by
# type via .github/release.yml).
#   - every push to main      → patch bump: v0.1.3 → v0.1.4 (first ever release: v0.0.1)
#   - milestone M<k> closed   → v0.<k+1>.0 (M0 → v0.1.0 … M4 → v0.5.0); M5 → v1.0.0,
#                               then stale branches are swept (scripts/ci/cleanup-branches.sh)
#   - manual run              → the version you type
# Each new release also gets an unsigned Artifacts-<version>.ipa to sideload (Sideloadly, AltStore…
# sign it with your own Apple ID). It's built without the TMDB key: release assets are public.
# And each new release is archived, signed and uploaded to TestFlight (docs/TESTFLIGHT.md), once
# the App Store Connect secrets are set; until then that job skips with a notice.

on:
  push:
    branches: [main]
  milestone:
    types: [closed]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to tag, e.g. v0.1.1"
        required: true

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      created: ${{ steps.publish.outputs.created }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Work out version
        id: v
        env:
          EVENT: ${{ github.event_name }}
          TITLE: ${{ github.event.milestone.title }}
          INPUT: ${{ inputs.version }}
        run: |
          latest=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -1)
          echo "latest tag: ${latest:-none}"
          case "$EVENT" in
            workflow_dispatch) v="$INPUT" ;;
            milestone)
              n=$(echo "$TITLE" | sed -nE 's/^M([0-9]+).*/\1/p')
              if [ -z "$n" ]; then echo "::error::Milestone '$TITLE' is not M<n>"; exit 1; fi
              if [ "$n" -ge 5 ]; then v="v1.0.0"; else v="v0.$((n + 1)).0"; fi ;;
            push)
              if [ -z "$latest" ]; then v="v0.0.1"; else
                IFS=. read -r major minor patch <<< "${latest#v}"
                v="v$major.$minor.$((patch + 1))"
              fi ;;
          esac
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Releasing $v"
      - name: Publish release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.version }}
          TITLE: ${{ github.event.milestone.title }}
        run: |
          if git rev-parse -q --verify "refs/tags/$V" >/dev/null; then echo "$V already exists"; exit 0; fi
          title="$V"
          [ -n "$TITLE" ] && title="$V · $TITLE"
          flags=()
          [[ "$V" == v0.* ]] && flags+=(--prerelease)
          gh release create "$V" --target "$(git rev-parse HEAD)" --generate-notes --title "$title" "${flags[@]}"
          echo "created=true" >> "$GITHUB_OUTPUT"
      - name: Delete stale branches
        if: github.event_name == 'milestone'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/cleanup-branches.sh

  ipa:
    # An unsigned build for real iPhones, attached to the release just made. Sideloading tools
    # sign it with the installer's own Apple ID, so no certificates live in this repo.
    needs: release
    if: needs.release.outputs.created == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release.outputs.version }}
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        # The runner sometimes fails with "Homebrew's files could not be checked inside the macOS
        # sandbox". Retry; the step still fails if every attempt does.
        run: |
          for attempt in 1 2 3; do
            brew install xcodegen && exit 0
            echo "::warning::brew install xcodegen failed (attempt $attempt of 3)"
            sleep 20
          done
          exit 1
      - name: Generate project
        run: xcodegen generate
      - name: Build (Release, iphoneos, unsigned)
        env:
          V: ${{ needs.release.outputs.version }}
        run: |
          set -o pipefail
          # No Config/Secrets.xcconfig: the TMDB key stays out of a public download (film
          # search says "no key"). Version numbers come from the tag.
          xcodebuild build \
            -project Artifacts.xcodeproj -scheme Artifacts -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            MARKETING_VERSION="${V#v}" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Package and upload the .ipa
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.release.outputs.version }}
        run: |
          app=build/DerivedData/Build/Products/Release-iphoneos/Artifacts.app
          test -d "$app" || { echo "::error::$app was not built"; exit 1; }
          mkdir -p ipa/Payload
          cp -R "$app" ipa/Payload/
          (cd ipa && zip -qry "../Artifacts-$V.ipa" Payload)
          ls -lh "Artifacts-$V.ipa"
          gh release upload "$V" "Artifacts-$V.ipa" --clobber

  testflight:
    # A signed build of the same release, uploaded to App Store Connect for TestFlight. Signing is
    # Xcode's cloud-managed signing, authorised by an App Store Connect API key, so no certificate
    # or profile is kept here. One-time setup: docs/TESTFLIGHT.md.
    needs: release
    if: needs.release.outputs.created == 'true'
    runs-on: macos-26
    timeout-minutes: 40
    env:
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Check the App Store Connect secrets
        id: secrets
        run: |
          if [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY" ] && [ -n "$TEAM_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::TestFlight skipped: set the App Store Connect secrets (docs/TESTFLIGHT.md)"
          fi
      - uses: actions/checkout@v5
        if: steps.secrets.outputs.ready == 'true'
        with:
          ref: ${{ needs.release.outputs.version }}
      - uses: maxim-lobanov/setup-xcode@v1
        if: steps.secrets.outputs.ready == 'true'
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        if: steps.secrets.outputs.ready == 'true'
        run: |
          for attempt in 1 2 3; do
            brew install xcodegen && exit 0
            echo "::warning::brew install xcodegen failed (attempt $attempt of 3)"
            sleep 20
          done
          exit 1
      - name: Generate project, TMDB key and API key
        if: steps.secrets.outputs.ready == 'true'
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          xcodegen generate
          # TestFlight builds are private, so they get film search.
          if [ -n "$TMDB_API_KEY" ]; then
            printf 'TMDB_API_KEY = %s\n' "$TMDB_API_KEY" > Config/Secrets.xcconfig
          else
            echo "::notice::TMDB_API_KEY secret not set; building without a TMDB key"
          fi
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY" > "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8"
      - name: Archive (Release, signed)
        if: steps.secrets.outputs.ready == 'true'
        env:
          V: ${{ needs.release.outputs.version }}
        run: |
          set -o pipefail
          # The version is the tag; the build number is this workflow's run number, which only
          # goes up, as App Store Connect requires.
          xcodebuild archive \
            -project Artifacts.xcodeproj -scheme Artifacts -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Artifacts.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="${V#v}" CURRENT_PROJECT_VERSION="${{ github.run_number }}"
      - name: Upload to App Store Connect
        if: steps.secrets.outputs.ready == 'true'
        run: |
          set -o pipefail
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>testFlightInternalTestingOnly</key><true/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/Artifacts.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "::notice::Uploaded ${{ needs.release.outputs.version }} (build ${{ github.run_number }}). It shows in TestFlight once App Store Connect has processed it, usually 5–15 minutes."
      - name: Remove the API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
