name: Project board

# Keeps the "Artifacts" GitHub Project in sync with the repo:
#   issue opened/reopened                 → Backlog (added to the board)
#   branch <type>/<issue#>-slug pushed    → In progress
#   PR opened with "Closes #N"            → #N In review
#   issue closed                          → Done
# Run it by hand to (re)seed the whole board from backlog/backlog.yaml.
# Needs a repository secret PROJECT_TOKEN: a classic personal access token with `repo` and
# `project` scopes (the default GITHUB_TOKEN cannot write to user projects).

on:
  issues:
    types: [opened, reopened, closed]
  create:
  pull_request_target:
    types: [opened, reopened, edited, ready_for_review]
  workflow_dispatch:
    inputs:
      bootstrap:
        description: "Run scripts/bootstrap_github.py (creates/updates the board, fields and all items)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  status:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check token
        id: token
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: |
          if [ -z "$PROJECT_TOKEN" ]; then
            echo "::warning::PROJECT_TOKEN secret not set; skipping board update"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      # Check out the default branch only (never PR code: pull_request_target has secrets).
      - uses: actions/checkout@v5
        if: steps.token.outputs.ok == 'true'
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: scripts/ci
      - name: Work out issues and status
        if: steps.token.outputs.ok == 'true'
        id: what
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          ISSUE: ${{ github.event.issue.number }}
          REF_TYPE: ${{ github.event.ref_type }}
          REF: ${{ github.event.ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          issues=""; status=""
          case "$EVENT" in
            issues)
              issues="$ISSUE"
              [ "$ACTION" = closed ] && status="Done" || status="Backlog" ;;
            create)
              if [ "$REF_TYPE" = branch ]; then
                issues=$(echo "$REF" | sed -nE 's#^[a-z]+/([0-9]+)-.*#\1#p'); status="In progress"
              fi ;;
            pull_request_target)
              issues=$(printf '%s' "$PR_BODY" | grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?) #[0-9]+' | grep -oE '[0-9]+' | sort -u | tr '\n' ' ')
              status="In review" ;;
          esac
          echo "issues=$issues" >> "$GITHUB_OUTPUT"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "issues: ${issues:-none} → ${status:-n/a}"
      - name: Update board
        if: steps.token.outputs.ok == 'true' && steps.what.outputs.issues != ''
        # A board problem (e.g. a token without the `project` scope) shouldn't mark PRs red;
        # the step still shows as failed in the run log.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          ISSUES: ${{ steps.what.outputs.issues }}
          STATUS: ${{ steps.what.outputs.status }}
        run: |
          for n in $ISSUES; do python3 scripts/ci/project_status.py "$n" "$STATUS"; done

  bootstrap:
    if: github.event_name == 'workflow_dispatch' && inputs.bootstrap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Seed board from backlog/backlog.yaml
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Add a PROJECT_TOKEN secret (classic PAT with repo + project scopes) first"
            exit 1
          fi
          python3 scripts/bootstrap_github.py
