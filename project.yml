# XcodeGen spec. Generate the project with `xcodegen generate` (the .xcodeproj is not committed).
name: Asvada
options:
  bundleIdPrefix: app.asvada
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
packages:
  Features:
    path: Packages/Features
  Model:
    path: Packages/Core/Model
  Storage:
    path: Packages/Core/Storage
  Geo:
    path: Packages/Core/Geo
  Sources:
    path: Packages/Core/Sources
  Ranking:
    path: Packages/Core/Ranking
  DesignSystem:
    path: Packages/Core/DesignSystem
targets:
  Asvada:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Resources
    dependencies:
      - package: Features
      - package: DesignSystem
      - package: Storage
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.asvada.Asvada
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Asvada
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  AsvadaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - AppUITests
    dependencies:
      - target: Asvada
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.asvada.AsvadaUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Asvada
schemes:
  Asvada:
    build:
      targets:
        Asvada: all
        AsvadaUITests: [test]
    test:
      targets:
        - AsvadaUITests
