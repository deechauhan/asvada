# XcodeGen spec. Generate the project with `xcodegen generate` (the .xcodeproj is not committed).
name: Artifacts
options:
  bundleIdPrefix: app.artifacts
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
packages:
  Features:
    path: Packages/Features
  Model:
    path: Packages/Core/Model
  Storage:
    path: Packages/Core/Storage
  Geo:
    path: Packages/Core/Geo
  Sources:
    path: Packages/Core/Sources
  Ranking:
    path: Packages/Core/Ranking
  DesignSystem:
    path: Packages/Core/DesignSystem
targets:
  Artifacts:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Resources
    dependencies:
      - package: Features
      - package: DesignSystem
      - package: Storage
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.artifacts.Artifacts
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Artifacts
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Artifacts uses where you are to guess the café, restaurant or country you're savouring. Nearby searches go to Apple Maps; your location is never stored or shared."
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Artifacts uses Face ID to unlock the app when you've turned the lock on. Nothing is stored or sent."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Artifacts reads where and when your photos were taken, on this phone only, to find places you've been. No pictures are copied or uploaded."
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Nothing uses the generated Swift asset symbols; generating them costs an actool run.
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
  ArtifactsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - AppUITests
    dependencies:
      - target: Artifacts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.artifacts.ArtifactsUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Artifacts
schemes:
  Artifacts:
    build:
      targets:
        Artifacts: all
        ArtifactsUITests: [test]
    test:
      targets:
        - ArtifactsUITests
